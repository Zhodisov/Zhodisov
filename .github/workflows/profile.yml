name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual run

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # STATS_TOKEN (classic PAT, read-only scopes) is needed to count private repos and
      # languages; without it the step is skipped so the committed cards are not downgraded.
      - name: Generate stat cards
        if: env.STATS_TOKEN != ''
        run: node scripts/stats.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: assets/generated
          EXCLUDE_REPOS: GCam-cracked,SecLists,test,de-pixelate_gaV-O6NPWrI
          HIDE_PROJECTS: NEW-SAFEMARKET-JSON,SafeMarket-Update,DisneyClient-Menu,SafeMarket-Server,profile-readme-test
          PROJECTS_COUNT: 14

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
