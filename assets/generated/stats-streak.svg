<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" fill="none" role="img" aria-label="Current streak 17 days, longest 124 days">
  <style>
    .f{opacity:0;animation:in .6s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .g{transform-box:fill-box;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleX(0)}
    @keyframes grow{to{transform:scaleX(1)}}
    .u{transform-box:fill-box;transform-origin:bottom;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleY(0)}
    @keyframes up{to{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.f,.g,.u{animation:none;opacity:1;transform:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#0A0D13"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B35"/><stop offset="1" stop-color="#E63946"/></linearGradient>
    <linearGradient id="accv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E63946"/><stop offset="1" stop-color="#FF6B35"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="245" rx="14" fill="url(#bg)" stroke="#1B2436"/>
  <text x="28" y="42" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#EEF2F8">Streak</text>
  <rect x="28" y="52" width="40" height="3" rx="1.5" fill="url(#acc)"/>
  <line x1="333" y1="80" x2="333" y2="220" stroke="#161C28"/><line x1="666" y1="80" x2="666" y2="220" stroke="#161C28"/>
  <g class="f" style="animation-delay:0ms" text-anchor="middle">
    
    <text x="167" y="130" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#EEF2F8">9,809</text>
    <text x="167" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#9FB0C8">Total contributions</text>
    <text x="167" y="218" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5A6B85">May 8, 2023 – Present</text>
  </g>
  <g class="f" style="animation-delay:120ms" text-anchor="middle">
    <circle cx="500" cy="118" r="46" stroke="#161C28" stroke-width="5"/>
    <circle cx="500" cy="118" r="46" stroke="url(#acc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 500 118)"><animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.2s" fill="freeze"/></circle>
    <g transform="translate(492 82)" color="#FF6B35"><path d="M8 1.5c.5 2.5 4.5 4 4.5 8a4.5 4.5 0 01-9 0c0-2 1-3.2 2-4 .2 1.3.8 2 1.5 2.3C7 5.5 7.3 3.3 8 1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></g>
    <text x="500" y="138" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#EEF2F8">17</text>
    <text x="500" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#FF6B35">Current streak</text>
    <text x="500" y="218" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5A6B85">Oct 13, 2026 – Oct 29, 2026</text>
  </g>
  <g class="f" style="animation-delay:240ms" text-anchor="middle">
    
    <text x="833" y="130" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#EEF2F8">124</text>
    <text x="833" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#9FB0C8">Longest streak</text>
    <text x="833" y="218" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5A6B85">May 22, 2024 – Sep 22, 2024</text>
  </g>
</svg>
