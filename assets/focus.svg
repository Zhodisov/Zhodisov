<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" fill="none" role="img" aria-label="Focus areas: Reverse Engineering, Full-Stack, Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="188" rx="14" fill="url(#bg)" stroke="#1B2436" stroke-width="1"/>

  <line x1="333.3" y1="40" x2="333.3" y2="150" stroke="#161C28" stroke-width="1"/>
  <line x1="666.6" y1="40" x2="666.6" y2="150" stroke="#161C28" stroke-width="1"/>

  <g text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="167" y="72" font-size="22" font-weight="700" fill="#EEF2F8">Reverse Engineering</text>
    <rect x="137" y="84" width="60" height="3" rx="1.5" fill="url(#acc)"/>
    <text x="167" y="116" font-size="14" fill="#9FB0C8">Understanding how closed</text>
    <text x="167" y="138" font-size="14" fill="#9FB0C8">systems really work.</text>

    <text x="500" y="72" font-size="22" font-weight="700" fill="#EEF2F8">Full-Stack</text>
    <rect x="470" y="84" width="60" height="3" rx="1.5" fill="url(#acc)"/>
    <text x="500" y="116" font-size="14" fill="#9FB0C8">Web apps built end to end,</text>
    <text x="500" y="138" font-size="14" fill="#9FB0C8">from interface to database.</text>

    <text x="833" y="72" font-size="22" font-weight="700" fill="#EEF2F8">Automation</text>
    <rect x="803" y="84" width="60" height="3" rx="1.5" fill="url(#acc)"/>
    <text x="833" y="116" font-size="14" fill="#9FB0C8">Services, bots and pipelines</text>
    <text x="833" y="138" font-size="14" fill="#9FB0C8">that run on their own.</text>
  </g>
</svg>
